version: "2"
run:
  timeout: 10m
issues:
  new-from-merge-base: origin/master
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable: [goimports]
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - unused
    - ineffassign
    - gosec
    - bodyclose
    - sqlclosecheck
    - noctx
    - contextcheck
    - rowserrcheck
    - durationcheck
    - copyloopvar
    - unconvert
    - misspell
    - prealloc
    - revive
    - gocritic
